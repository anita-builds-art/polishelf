<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PoliShelf">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#dfdee6">
<title>PoliShelf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;700;800&family=Bagel+Fat+One&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #dfdee6; --panel: #e9e8f0; --surface: #ffffff; --ink: #1b1830; --muted: #53506b; --line: #c6c3d4;
  --grad: linear-gradient(90deg, #d6338a, #6a4ce0);
  --font: "Syne", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
  box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); line-height: 1.45; -webkit-text-size-adjust: 100%; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
main, #detail > * { max-width: 640px; margin-left: auto; margin-right: auto; }
main { padding: 18px 18px 56px; }
h1 { font-family: "Bagel Fat One", "Avenir Next", system-ui, sans-serif; font-weight: 400; font-size: clamp(2.6rem, 13vw, 3.6rem); line-height: 1.05; letter-spacing: 0; white-space: nowrap; margin: 8px 0 12px; color: #ff5fae; -webkit-text-stroke: 1.5px var(--ink); filter: drop-shadow(3px 3px 0 var(--ink)); }
h1 .sh { background: linear-gradient(90deg, #ff5fae, #ffd23f); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }
h1 .y { color: #ffd23f; }
.sub { color: var(--muted); margin: 0 0 20px; }

.fbtn { display: flex; justify-content: space-between; align-items: center; width: 100%; margin-top: 10px; border: 1.5px solid var(--line); background: transparent; border-radius: 999px; padding: 8px 16px; min-height: 44px; font-weight: 700; font-size: .9rem; }
.fbtn .chev { transition: transform .2s; }
.fbtn[aria-expanded="true"] .chev { transform: rotate(180deg); }
.clear { align-self: flex-start; border: 0; background: none; padding: 6px 0; font-weight: 700; font-size: .9rem; text-decoration: underline; }
.pick { background: var(--panel); border: 1px solid var(--line); border-radius: 28px; padding: 18px; }
.filters { display: flex; flex-direction: column; gap: 12px; margin: 14px 0 4px; }
.filter-label { font-size: .85rem; color: var(--muted); margin: 0 0 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1.5px solid var(--line); background: transparent; padding: 8px 14px; border-radius: 999px; min-height: 40px; font-size: .9rem; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
.btn { font-weight: 700; font-size: 1.1rem; width: 100%; border: 0; border-radius: 999px; padding: 16px; min-height: 56px; background: var(--grad); color: #fff; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.ghost { background: transparent; border: 1.5px solid var(--ink); color: var(--ink); }
.note { margin: 10px 0 0; color: var(--muted); font-size: .92rem; }

.shelf-head { display: flex; justify-content: space-between; align-items: baseline; margin: 30px 0 14px; }
.shelf-head h2 { margin: 0; font-size: 1.4rem; font-weight: 700; }
.shelf-head span { color: var(--muted); font-size: .95rem; }
.seg { display: inline-flex; border: 1.5px solid var(--ink); border-radius: 999px; padding: 2px; margin: 0 0 16px; background: var(--panel); }
.seg button { border: 0; background: transparent; padding: 5px 12px; border-radius: 999px; font-weight: 700; min-height: 32px; font-size: .8rem; }
.seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px 14px; }
@media (min-width: 560px) { .grid { grid-template-columns: repeat(3, 1fr); } }

/* Landing tile: swipe between bottle and wearing photo */
.item { margin: 0; text-align: center; }
.item.dim { opacity: .35; }
.thumb { position: relative; }
.mini { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; -webkit-overflow-scrolling: touch; border-radius: 999px 999px 18px 18px; background: var(--surface); box-shadow: 0 8px 24px -12px rgba(60,40,120,.35); }
.mini::-webkit-scrollbar { display: none; }
.ms { flex: 0 0 100%; scroll-snap-align: center; aspect-ratio: 11/16; }
.ms img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ms.ph { display: flex; align-items: center; justify-content: center; background: var(--c); color: var(--ci); font-size: 2rem; }
.mdots { position: absolute; left: 0; right: 0; bottom: 10px; display: flex; justify-content: center; gap: 6px; pointer-events: none; }
.mdots i { width: 7px; height: 7px; border-radius: 50%; background: #fff; opacity: .55; box-shadow: 0 0 3px rgba(0,0,0,.5); }
.mdots i.on { opacity: 1; }
.txt { display: block; width: 100%; border: 0; background: none; padding: 8px 0 0; text-align: center; }
.txt .name { display: block; font-weight: 700; }
.txt .meta { display: block; color: var(--muted); font-size: .85rem; }
.txt .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; background: var(--c); }

/* Detail screen: light wash of the polish colour */
#detail { min-height: 100vh; padding: 18px 18px 48px; background: var(--bg); background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 38%, var(--bg)), var(--bg) 70%); }
.topbar { display: flex; align-items: center; margin-bottom: 14px; }
.back { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--ink); background: rgba(255,255,255,.6); border-radius: 999px; padding: 10px 18px 10px 14px; min-height: 44px; font-weight: 700; }
.stage { display: grid; gap: 14px; }
.carousel { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; -webkit-overflow-scrolling: touch; border-radius: 999px 999px 24px 24px; max-width: 290px; width: 100%; margin: 0 auto; box-shadow: 0 20px 60px -20px color-mix(in srgb, var(--accent) 80%, transparent); background: var(--surface); }
.carousel::-webkit-scrollbar { display: none; }
.slide { flex: 0 0 100%; scroll-snap-align: center; aspect-ratio: 11/16; }
.slide img { width: 100%; height: 100%; object-fit: cover; display: block; }
.slide.ph { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 24px; text-align: center; background: var(--accent); color: var(--accent-ink); }
.slide.ph .big { font-size: 3rem; line-height: 1; }
.caption { display: flex; justify-content: center; align-items: center; gap: 10px; font-size: .92rem; min-height: 24px; margin-top: 12px; }
.dots { display: flex; gap: 6px; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--ink); opacity: .3; transition: opacity .2s, transform .2s; }
.dots i.on { opacity: 1; transform: scale(1.25); }
.info { text-align: center; }
.info h2 { font-size: 2.1rem; line-height: 1.05; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 6px; }
.info p { margin: 0 0 3px; }
.actions { display: grid; gap: 10px; margin-top: 18px; }
@media (prefers-reduced-motion: reduce) { .dots i { transition: none; } }
</style>
</head>
<body>

<main id="home">
  <h1 aria-label="PoliShelf">Poli<span class="sh">Sh</span><span class="y">elf</span></h1>
  <p class="sub">Swipe a photo to see the other one. Tap to open.</p>
  <section class="pick">
    <button class="btn" id="pick-btn" type="button">Pick for me</button>
    <button class="fbtn" id="fbtn" type="button" aria-expanded="false" aria-controls="filters"><span id="fsum">Filters</span><span class="chev" aria-hidden="true">&#9662;</span></button>
    <div class="filters" id="filters" hidden>
      <div><p class="filter-label">Shade</p><div class="chips" id="shade-chips"></div></div>
      <div><p class="filter-label">Colour</p><div class="chips" id="family-chips"></div></div>
      <div><p class="filter-label">Finish</p><div class="chips" id="finish-chips"></div></div>
      <button class="clear" id="clear" type="button" hidden>Clear filters</button>
    </div>
    <p class="note" id="note" hidden></p>
  </section>
  <div class="shelf-head"><h2>Your polishes</h2><span id="count"></span></div>
  <div class="seg" role="group" aria-label="Which photo to show first">
    <button type="button" data-v="bottle" aria-pressed="true">Bottles</button>
    <button type="button" data-v="worn" aria-pressed="false">In action</button>
  </div>
  <div class="grid" id="grid"></div>
</main>

<section id="detail" hidden>
  <div class="topbar"><button class="back" id="back" type="button">&#8249; Back to shelf</button></div>
  <div class="stage">
    <div>
      <div class="carousel" id="carousel" tabindex="0" aria-label="Photos of this polish. Swipe left or right."></div>
      <div class="caption"><span id="slide-label"></span><span class="dots" id="dots" aria-hidden="true"></span></div>
    </div>
    <div class="info">
      <h2 id="d-name"></h2>
      <p id="d-brand"></p>
      <p id="d-attr"></p>
      <p id="d-worn"></p>
    </div>
  </div>
  <div class="actions">
    <button class="btn" id="again" type="button">Pick again</button>
    <button class="btn ghost" id="wear" type="button">I'll wear this</button>
  </div>
</section>

const POLISHES = [
  { id:"catrice-splish-splash", brand:"Catrice", line:"Super Brights", name:"Splish Splash", family:"blue", finish:"shiny", shade:"light", hex:"#1c8cb4" },
  { id:"hm-sky-high", brand:"H&M", line:null, name:"Sky High", family:"blue", finish:"shiny", shade:"light", hex:"#6a8fd6" },
  { id:"hm-iced-mint", brand:"H&M", line:null, name:"Iced Mint", family:"green", finish:"metallic", shade:"dark", hex:"#23907c" },
  { id:"la-girl-good-vibes-only", brand:"L.A. Girl", line:"Gel", name:"Good Vibes Only", family:"orange", finish:"shiny", shade:"light", hex:"#f08a6c" },
  { id:"rival-fuchsia-fizz", brand:"Rival Loves Me", line:"Neon Explosion", name:"Fuchsia Fizz", family:"pink", finish:"neon", shade:"dark", hex:"#c9146f" },
  { id:"catrice-lavendher", brand:"Catrice", line:"ICONails", name:"LavendHER", family:"purple", finish:"shiny", shade:"light", hex:"#b5a6d6" },
  { id:"rival-blue-tastic", brand:"Rival Loves Me", line:"Neon Explosion", name:"Blue-Tastic", family:"blue", finish:"neon", shade:"dark", hex:"#2431c4" }
];

const state = { families: new Set(), shades: new Set(), finishes: new Set(), lastPickId: null, current: null, worn: {}, scrollY: 0, view: "bottle" };
const DAY = 86400000;
const $ = (id) => document.getElementById(id);
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);

function loadWorn() { try { state.worn = JSON.parse(localStorage.getItem("polish-worn") || "{}"); } catch (e) { state.worn = {}; } }
function saveWorn() { try { localStorage.setItem("polish-worn", JSON.stringify(state.worn)); } catch (e) {} }
function daysSince(id) { const t = state.worn[id]; return t ? Math.floor((Date.now() - t) / DAY) : null; }
function wornText(id) {
  const d = daysSince(id);
  if (d === null) return "Not worn yet";
  if (d === 0) return "Worn today";
  if (d === 1) return "Worn yesterday";
  return "Worn " + d + " days ago";
}
function ink(hex) {
  const n = parseInt(hex.slice(1), 16);
  const l = [n >> 16, (n >> 8) & 255, n & 255].map(v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); });
  return (.2126 * l[0] + .7152 * l[1] + .0722 * l[2]) > .35 ? "#1b1830" : "#ffffff";
}
const matches = (p) => (!state.families.size || state.families.has(p.family)) && (!state.shades.size || state.shades.has(p.shade)) && (!state.finishes.size || state.finishes.has(p.finish));
function slideIndex(el, count) { return Math.max(0, Math.min(count - 1, Math.round(el.scrollLeft / (el.clientWidth || 1)))); }

function buildChips(containerId, values, set) {
  const el = $(containerId);
  values.forEach(v => {
    const b = document.createElement("button");
    b.className = "chip"; b.type = "button"; b.textContent = cap(v); b.setAttribute("aria-pressed", "false");
    b.addEventListener("click", () => {
      set.has(v) ? set.delete(v) : set.add(v);
      b.setAttribute("aria-pressed", set.has(v));
      renderGrid(); updatePickState();
    });
    el.appendChild(b);
  });
}

function renderGrid() {
  const g = $("grid"); g.innerHTML = "";
  POLISHES.forEach(p => {
    const f = document.createElement("figure");
    f.className = "item" + (matches(p) ? "" : " dim");
    f.style.setProperty("--c", p.hex); f.style.setProperty("--ci", ink(p.hex));
    const bottleSlide = '<div class="ms"><img alt="' + p.brand + " " + p.name + ' bottle" src="' + IMAGES[p.id] + '"></div>';
    const second = IN_USE[p.id]
      ? '<div class="ms"><img alt="Wearing ' + p.name + '" src="' + IN_USE[p.id] + '"></div>'
      : '<div class="ms ph" aria-hidden="true">&#127846;</div>';
    f.innerHTML = '<div class="thumb"><div class="mini" tabindex="0" role="group" aria-label="' + p.brand + " " + p.name + '. Swipe for the photo of you wearing it.">' +
      (state.view === "worn" ? second + bottleSlide : bottleSlide + second) + '</div>' +
      '<span class="mdots" aria-hidden="true"><i class="on"></i><i></i></span></div>' +
      '<button class="txt" type="button"><span class="name"><i class="dot"></i>' + p.name + '</span><span class="meta">' + p.brand + " · " + p.finish + '</span><span class="meta">' + wornText(p.id) + '</span></button>';
    const mini = f.querySelector(".mini"), dots = f.querySelectorAll(".mdots i");
    mini.addEventListener("scroll", () => { const i = slideIndex(mini, 2); dots.forEach((d, k) => d.classList.toggle("on", k === i)); }, { passive: true });
    mini.addEventListener("click", () => openDetail(p, "browse"));
    mini.addEventListener("keydown", (e) => {
      if (e.key === "Enter") openDetail(p, "browse");
      if (e.key === "ArrowRight") mini.scrollBy({ left: mini.clientWidth, behavior: "smooth" });
      if (e.key === "ArrowLeft") mini.scrollBy({ left: -mini.clientWidth, behavior: "smooth" });
    });
    f.querySelector(".txt").addEventListener("click", () => openDetail(p, "browse"));
    g.appendChild(f);
  });
  const n = POLISHES.filter(matches).length;
  $("count").textContent = n === POLISHES.length ? POLISHES.length + " bottles" : n + " of " + POLISHES.length + " match";
}

function updatePickState() {
  const pool = POLISHES.filter(matches);
  const active = state.families.size + state.shades.size + state.finishes.size;
  $("pick-btn").disabled = pool.length === 0;
  $("fsum").textContent = active ? "Filters · " + active + " on" : "Filters";
  $("clear").hidden = active === 0;
  const note = $("note");
  if (pool.length === 0) { note.hidden = false; note.textContent = "No polish matches these filters. Remove one to pick again."; }
  else if (active) { note.hidden = false; note.textContent = "Picking from " + pool.length + " matching bottle" + (pool.length === 1 ? "" : "s") + "."; }
  else { note.hidden = true; note.textContent = ""; }
}
$("fbtn").addEventListener("click", () => {
  const open = $("filters").hidden;
  $("filters").hidden = !open;
  $("fbtn").setAttribute("aria-expanded", open);
});
$("clear").addEventListener("click", () => {
  state.families.clear(); state.shades.clear(); state.finishes.clear();
  document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", "false"));
  renderGrid(); updatePickState();
});

// Polishes you haven't worn lately are more likely to come up.
function choose() {
  let pool = POLISHES.filter(matches);
  if (pool.length > 1 && state.lastPickId) pool = pool.filter(p => p.id !== state.lastPickId);
  const w = pool.map(p => { const d = daysSince(p.id); return d === null ? 30 : Math.min(d, 30) + 1; });
  let r = Math.random() * w.reduce((a, b) => a + b, 0);
  for (let i = 0; i < pool.length; i++) { r -= w[i]; if (r <= 0) return pool[i]; }
  return pool[pool.length - 1];
}

/* ---------- Detail screen ---------- */
const SLIDES = ["Bottle", "Wearing it"];
function renderCarousel(p) {
  const c = $("carousel"); c.innerHTML = "";
  const s1 = document.createElement("div"); s1.className = "slide";
  s1.innerHTML = '<img alt="' + p.brand + " " + p.name + ' bottle" src="' + IMAGES[p.id] + '">';
  const s2 = document.createElement("div");
  if (IN_USE[p.id]) { s2.className = "slide"; s2.innerHTML = '<img alt="Wearing ' + p.name + '" src="' + IN_USE[p.id] + '">'; }
  else { s2.className = "slide ph"; s2.innerHTML = '<div class="big" aria-hidden="true">&#127846;</div><strong>No photo yet</strong><span>Your photo wearing ' + p.name + ' goes here.</span>'; }
  c.append(s1, s2);
  c.scrollLeft = 0;
  $("dots").innerHTML = "<i></i><i></i>";
  updateSlide();
}
function updateSlide() {
  const i = slideIndex($("carousel"), SLIDES.length);
  [...$("dots").children].forEach((d, k) => d.classList.toggle("on", k === i));
  $("slide-label").textContent = SLIDES[i];
}
$("carousel").addEventListener("scroll", updateSlide, { passive: true });
$("carousel").addEventListener("keydown", (e) => {
  const c = $("carousel");
  if (e.key === "ArrowRight") c.scrollBy({ left: c.clientWidth, behavior: "smooth" });
  if (e.key === "ArrowLeft") c.scrollBy({ left: -c.clientWidth, behavior: "smooth" });
});

function openDetail(p, mode) {
  if (!$("home").hidden) state.scrollY = window.scrollY;
  state.current = p;
  if (mode === "pick") state.lastPickId = p.id;
  const d = $("detail");
  d.style.setProperty("--accent", p.hex); d.style.setProperty("--accent-ink", ink(p.hex));
  renderCarousel(p);
  $("d-name").textContent = p.name;
  $("d-brand").textContent = p.brand + (p.line ? " " + p.line : "");
  $("d-attr").textContent = cap(p.family) + " · " + p.shade + " · " + p.finish;
  $("d-worn").textContent = wornText(p.id);
  $("again").hidden = mode !== "pick";
  const wear = $("wear"); wear.disabled = false; wear.textContent = "I'll wear this";
  $("home").hidden = true; d.hidden = false;
  const cc = $("carousel"); cc.scrollLeft = state.view === "worn" ? cc.clientWidth : 0; updateSlide();
  window.scrollTo(0, 0);
  $("back").focus({ preventScroll: true });
}
function showHome() {
  $("detail").hidden = true; $("home").hidden = false;
  renderGrid();
  window.scrollTo(0, state.scrollY);
}

$("pick-btn").addEventListener("click", () => { const p = choose(); if (p) openDetail(p, "pick"); });
$("again").addEventListener("click", () => { const p = choose(); if (p) openDetail(p, "pick"); });
$("back").addEventListener("click", showHome);
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("detail").hidden) showHome(); });
$("wear").addEventListener("click", () => {
  if (!state.current) return;
  state.worn[state.current.id] = Date.now(); saveWorn();
  $("wear").textContent = "Saved as worn today"; $("wear").disabled = true;
  $("d-worn").textContent = wornText(state.current.id);
});

function setView(v, save) {
  state.view = v;
  document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === v));
  if (save) { try { localStorage.setItem("polish-view", v); } catch (e) {} }
}
document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => { setView(b.dataset.v, true); renderGrid(); }));
try { const v = localStorage.getItem("polish-view"); if (v === "worn" || v === "bottle") setView(v, false); } catch (e) {}

loadWorn();
buildChips("family-chips", [...new Set(POLISHES.map(p => p.family))], state.families);
buildChips("shade-chips", ["light", "dark"], state.shades);
buildChips("finish-chips", [...new Set(POLISHES.map(p => p.finish))], state.finishes);
renderGrid(); updatePickState();
</script>
